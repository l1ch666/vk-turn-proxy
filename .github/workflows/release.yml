name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - "v2.*.*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tag and provenance
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match v2.MINOR.PATCH with numeric components: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --tags origin
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "Release commit is not reachable from origin/main: $RELEASE_SHA" >&2
            exit 1
          fi
          highest_release_tag="$(
            git tag --list 'v2.*.*' |
              grep -E '^v2\.[0-9]+\.[0-9]+$' |
              LC_ALL=C sort -V |
              tail -n 1
          )"
          if [ "$RELEASE_TAG" != "$highest_release_tag" ]; then
            echo "Refusing to move mutable release tags backwards: newest tag is $highest_release_tag" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          test -z "$files" || {
            printf 'Files need gofmt:\n%s\n' "$files"
            exit 1
          }

      - name: Verify modules
        run: go mod verify

      - name: Test with race detector
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m ./...

      - name: Scan reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Audit third-party licenses
        id: license-audit
        continue-on-error: true
        run: bash scripts/audit-third-party-licenses.sh legal-materials

      - name: Upload license audit materials
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: legal-materials
          path: legal-materials
          if-no-files-found: error
          retention-days: 7

      - name: Enforce third-party license audit
        if: ${{ steps.license-audit.outcome != 'success' }}
        run: |
          echo "Third-party license audit failed; inspect the legal-materials artifact." >&2
          exit 1

  build:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            cgo: 0
          - goos: linux
            goarch: arm64
            cgo: 0
          - goos: linux
            goarch: "386"
            cgo: 0
          - goos: linux
            goarch: arm
            goarm: "7"
            cgo: 0
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: mips
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: mips64le
            gomips: softfloat
            cgo: 0
          - goos: linux
            goarch: riscv64
            cgo: 0
          - goos: darwin
            goarch: amd64
            cgo: 0
          - goos: darwin
            goarch: arm64
            cgo: 0
          - goos: windows
            goarch: amd64
            cgo: 0
          - goos: windows
            goarch: arm64
            cgo: 0
          - goos: windows
            goarch: "386"
            cgo: 0
          - goos: android
            goarch: arm64
            cgo: 1
            api: 21
          - goos: android
            goarch: arm
            goarm: "7"
            cgo: 1
            api: 21
          - goos: freebsd
            goarch: amd64
            cgo: 0

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Android NDK
        if: matrix.goos == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Download audited legal materials
        uses: actions/download-artifact@v7
        with:
          name: legal-materials
          path: THIRD_PARTY_LICENSES

      - name: Build and package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: ${{ matrix.cgo }}
          ANDROID_API: ${{ matrix.api }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eu
          if [ "$GOOS" = android ]; then
            toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            case "$GOARCH" in
              arm64) export CC="$toolchain/aarch64-linux-android${ANDROID_API}-clang" ;;
              arm) export CC="$toolchain/armv7a-linux-androideabi${ANDROID_API}-clang" ;;
              *) echo "Unsupported Android architecture: $GOARCH" >&2; exit 1 ;;
            esac
          fi

          extension=
          [ "$GOOS" != windows ] || extension=.exe
          variant=
          [ -z "${GOARM:-}" ] || variant="-v${GOARM}"
          package_name="vk-turn-proxy-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${variant}"
          linker_flags="-s -w"
          # Pion's Android interface enumeration depends on wlynxg/anet,
          # whose documented Go 1.23+ build contract requires this check.
          [ "$GOOS" != android ] || linker_flags="$linker_flags -checklinkname=0"

          mkdir -p "package" "release"
          go build -trimpath -ldflags="$linker_flags" -o "package/vk-turn-client${extension}" ./client
          go build -trimpath -ldflags="$linker_flags" -o "package/vk-turn-server${extension}" ./server
          go build -trimpath -ldflags="$linker_flags" -o "package/vk-turn-bench${extension}" ./cmd/vk-turn-bench
          cp LICENSE NOTICE README.md docs/RELEASE_LEGAL.md package/
          cp -R THIRD_PARTY_LICENSES package/

          case "$GOOS" in
            linux)
              cp routes.sh package/
              chmod 0755 package/routes.sh
              cp "package/vk-turn-server" "release/server-linux-${GOARCH}"
              ;;
            darwin)
              cp routes-macos.sh package/
              chmod 0755 package/routes-macos.sh
              ;;
            windows)
              cp routes.ps1 package/
              ;;
          esac

          if [ "$GOOS" = windows ]; then
            (cd package && zip -9 -r "../release/${package_name}.zip" .)
          else
            tar -czf "release/${package_name}.tar.gz" -C package .
          fi

      - name: Upload package
        if: ${{ vars.RELEASE_LEGAL_APPROVED == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goarm }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: ${{ vars.RELEASE_LEGAL_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Create release without overwriting assets
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false

  docker:
    name: Publish Docker image
    needs: publish
    if: ${{ vars.RELEASE_LEGAL_APPROVED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Download audited legal materials
        uses: actions/download-artifact@v7
        with:
          name: legal-materials
          path: THIRD_PARTY_LICENSES

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
